<section id="projects" class="projects-section" aria-labelledby="projects-title">
  <header class="section-heading">
    <p class="section-eyebrow">Selected work</p>
    <h2 class="page-title" id="projects-title">Projects that show how I think and build.</h2>
    <p class="section-intro">A selection of web, desktop, and systems projects spanning interface design, collaboration, and low-level problem solving.</p>
  </header>

  <div class="projects-grid">
    <app-project-card
        *ngFor="let project of projects; let i = index"
        [projectName]="project.name"
        [projectCategory]="project.category"
        [projectDescription]="project.description"
        [projectHighlights]="project.highlights"
        [projectTechnologies]="project.technologies"
        [projectLink]="project.link"
        [projectImage]="project.imageUrl"
        [projectIcon]="project.icon"
        [projectNumber]="i + 1">
    </app-project-card>
  </div>
</section>
