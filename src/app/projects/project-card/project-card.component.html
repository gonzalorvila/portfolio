<mat-card class="project-card">
  <mat-card-header>
    <svg
      *ngIf="projectIcon"
      class="project-icon"
      viewBox="0 0 24 24"
      aria-hidden="true"
      focusable="false">
      <path *ngIf="projectIcon === 'keyboard_command_key'" d="M18 9.5a3.5 3.5 0 1 0-3.5-3.5v1H9.5V6A3.5 3.5 0 1 0 6 9.5h1v5H6a3.5 3.5 0 1 0 3.5 3.5v-1h5v1a3.5 3.5 0 1 0 3.5-3.5h-1v-5h1ZM17 6a1 1 0 1 1 1 1h-1V6ZM6 7a1 1 0 1 1 1-1v1H6Zm1 11a1 1 0 1 1-1-1h1v1Zm2.5-3.5v-5h5v5h-5ZM18 17a1 1 0 1 1-1 1v-1h1Z"/>
      <path *ngIf="projectIcon === 'lock_open'" d="M12 1a5 5 0 0 0-5 5h2a3 3 0 0 1 5.83-1H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-.1A5 5 0 0 0 12 1Zm5 18H7V7h10v12Zm-5-3a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/>
    </svg>
    <mat-card-title class="project-card-name">{{projectName}}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <img mat-card-image id="project-card-image" *ngIf="projectImage" [src]="projectImage" [alt]="projectName + ' project preview'" loading="lazy">
    <p>{{projectDescription}}</p>
  </mat-card-content>
  <mat-card-actions>
    <a mat-raised-button color="primary" [href]="projectLink" target="_blank" rel="noopener noreferrer">
      View on GitHub
    </a>
  </mat-card-actions>
</mat-card>
